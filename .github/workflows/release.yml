name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows-msvc:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-${{ env.ImageOS }}

      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Prepare artifact directory
        run: mkdir -p release

      - name: Copy binary
        run: cp target/x86_64-pc-windows-msvc/release/rust-proxy.exe release/rust-proxy.exe

      - name: Create tar.gz
        run: cd release && tar -czf ../rust-proxy-x86_64-pc-windows-msvc.tar.gz rust-proxy.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-proxy-x86_64-pc-windows-msvc
          path: rust-proxy-x86_64-pc-windows-msvc.tar.gz
          if-no-files-found: error

  build-windows-gnu:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-gnu-${{ env.ImageOS }}

      - name: Install MinGW
        run: choco install mingw -y

      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Prepare artifact directory
        run: mkdir -p release

      - name: Copy binary
        run: cp target/x86_64-pc-windows-gnu/release/rust-proxy.exe release/rust-proxy.exe

      - name: Create tar.gz
        run: cd release && tar -czf ../rust-proxy-x86_64-pc-windows-gnu.tar.gz rust-proxy.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-proxy-x86_64-pc-windows-gnu
          path: rust-proxy-x86_64-pc-windows-gnu.tar.gz
          if-no-files-found: error

  build-linux-gnu:
    runs-on: ubuntu-latest
    # 固定 glibc 2.35 基线（Ubuntu 22.04，支持到 2027）：
    #   - 隔离 ubuntu-latest 迁到 26.04 带来的 glibc/OpenSSL 变化
    #   - 20.04 已过标准支持期，apt 源随时可能变动
    #   - 需要更老的 glibc 兼容性时用 musl 产物（完全静态）
    container: ubuntu:22.04
    steps:
      # 必须排在 checkout 之前：
      #   1. 该基础镜像没有 git，checkout 会静默降级成 REST API 拉 tarball（无 .git）
      #   2. openssl 是 vendored 从源码编译，需要 perl（Configure 脚本）
      #   3. actions/cache 需要 zstd，否则退化成 gzip，缓存版本与其它 job 不一致
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git perl build-essential zstd gzip tar

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu-${{ env.ImageOS }}

      - name: Build release
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Prepare artifact directory
        run: mkdir -p release

      - name: Copy binary
        run: cp target/x86_64-unknown-linux-gnu/release/rust-proxy release/rust-proxy

      - name: Create tar.gz
        run: cd release && tar -czf ../rust-proxy-x86_64-unknown-linux-gnu.tar.gz rust-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-proxy-x86_64-unknown-linux-gnu
          path: rust-proxy-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  build-linux-musl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl-${{ env.ImageOS }}

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Prepare artifact directory
        run: mkdir -p release

      - name: Copy binary
        run: cp target/x86_64-unknown-linux-musl/release/rust-proxy release/rust-proxy

      - name: Create tar.gz
        run: cd release && tar -czf ../rust-proxy-x86_64-unknown-linux-musl.tar.gz rust-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-proxy-x86_64-unknown-linux-musl
          path: rust-proxy-x86_64-unknown-linux-musl.tar.gz
          if-no-files-found: error

  release:
    needs: [build-windows-msvc, build-windows-gnu, build-linux-gnu, build-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          # 只上传 tar.gz，避免把目录结构带进 release assets
          shopt -s nullglob
          files=(artifacts/*/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no tar.gz found under artifacts/, download-artifact step failed?"
            ls -R artifacts || true
            exit 1
          fi
          printf 'assets:\n'; printf '  %s\n' "${files[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, uploading assets with --clobber"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" \
              --target "$GITHUB_SHA" --generate-notes
          fi

          echo "release url: $(gh release view "$TAG" --json url -q .url)"
