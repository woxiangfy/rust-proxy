# Sample configuration for rust-proxy
# Copy this file to config.toml and modify as needed
# Command line arguments take precedence over config file settings

# Port to bind for HTTP proxy.
# 启用规则：
#   - 显式指定 port → 启用 HTTP 代理
#   - 未指定 port 且未指定 https_port → 使用默认值 8080 启用 HTTP 代理
#   - 未指定 port 但指定了 https_port → 不启用 HTTP 代理（仅 HTTPS 模式）
port = 8080

# Log file path (optional, defaults to console output)
# log_file = "proxy.log"

# Request timeout in seconds (default: 30)
timeout = 30

# Log level: trace, debug, info, warn, error (default: info)
log_level = "info"

# 启用多线程运行时 (default: false)
# multi_thread = false

# 用户认证配置（可选）
# 配置任意数量的 [[auth]] 段后，代理将要求客户端通过 HTTP Basic 认证
# （携带 Proxy-Authorization 头）才能使用。省略整个 [[auth]] 段则不启用认证。
# 客户端示例: curl -x http://admin:secret@127.0.0.1:8080 http://example.com
#
# [[auth]]
# username = "admin"
# password = "secret"
#
# [[auth]]
# username = "user2"
# password = "another-password"

# HTTPS (TLS) 代理配置（可选）
# 启用规则：只有显式指定了 https_port 才会启用 HTTPS 代理监听。
#   - 同时配置合法 tls_cert + tls_key → 使用用户证书，支持证书热重载
#   - 未配置 / 加载失败的 tls_cert 或 tls_key → 自动生成 10 年有效期自签证书（输出 warn 日志）
#   - 未配置 https_port → 不启用 HTTPS（即使配置了 tls_cert/tls_key 也忽略）
# 客户端示例: curl -x https://127.0.0.1:8443 --proxy-cacert cert.pem https://example.com
#
# https_port = 8443           # HTTPS 代理监听端口（必填，无默认值；不设置则不启用 HTTPS）
# tls_cert = "cert.pem"       # TLS 证书文件路径（PEM 格式），可配置相对路径（相对于配置文件目录）
# tls_key = "key.pem"         # TLS 私钥文件路径（PEM 格式），支持 PKCS#8 或 RSA

# PROXY Protocol 解析（可选，默认 false）
# 适用于代理服务挂在 nginx/HAProxy 后面、通过 SNI 分流并使用
# `proxy_protocol on;` 转发真实客户端 IP 的场景。
# 启用后，每个接入连接会先解析 PROXY Protocol 头（v1/v2 自动检测），
# 提取真实客户端 IP 用于日志和认证。
#
# 安全提示：建议同时配置 proxy_protocol_trusted_ips 以限制仅接受
# 来自可信代理 IP 的 PROXY Protocol 头，防止客户端伪造 IP。
#
# nginx 配置示例：
#   stream {
#       server {
#           listen 443;
#           proxy_pass $backend;
#           ssl_preread on;
#           proxy_protocol on;  # 启用 PROXY Protocol 转发真实 IP
#       }
#   }
#
# proxy_protocol = false
# proxy_protocol_trusted_ips = ["10.0.0.1"]  # 仅接受来自 nginx IP 的 PROXY Protocol 头